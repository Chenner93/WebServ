# Exemple de fichier webserv.conf

server {
	listen 127.0.0.1:8080;
	server_name example.com www.example.com;
	client_max_body_size 10M;
	# client_max_body_size 100;

	error_page 404 ./tmp/www/error_pages/404.html;

	location /
	{
		root ./tmp/www/html;
		allow_methods GET POST;
		index index.html;
		autoindex on;
	}

	location /upload
	{
		root ./tmp/www/upload;
		allow_methods GET POST;
		upload_dir ./tmp/www/upload/files;
	}

	location /cgi-bin
	{
		root ./tmp/www/cgi-bin;
		allow_methods GET POST;
		cgi_extension .php /bin/php-cgi;
		cgi_extension .py /bin/python3;
		cgi_extension .sh /bin/bash;
	}

	location /images
	{
		root ./tmp/www/static/;
		allow_methods GET;
		autoindex on;
	}
}

server {
	listen 0.0.0.0:8082;

	location /
	{
		root ./tmp/www/static;
		allow_methods GET;
		autoindex on;
		index index.html;
	}

	location /images
	{
		root ./tmp/www/static/images;
		allow_methods GET;
		autoindex on;
	}
}
